<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>z-etl 控制台</title>
<style>
  :root{
    --bg:#f0f2f5; --panel:#ffffff; --panel2:#fafafa; --line:#f0f0f0;
    --fg:rgba(0,0,0,.88); --dim:#8c8c8c; --acc:#1677ff; --ok:#52c41a; --err:#ff4d4f; --warn:#d48806;
    font-size:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .layout{display:flex;min-height:100vh}
  aside{width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column}
  .brand{font-size:16px;font-weight:600;padding:0 8px 4px}
  aside .sub{color:var(--dim);font-size:11px;padding:0 8px 12px;word-break:break-all}
  .tgroup{margin-bottom:2px}
  .trow{display:flex;align-items:center;gap:6px;padding:0 8px;min-height:32px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg)}
  .trow:hover{background:var(--panel2)}
  .tgroup.on .trow{background:#e6f4ff;color:var(--acc)}
  .trow .arrow{display:inline-block;width:14px;color:var(--dim);transition:transform .15s;font-size:11px}
  .tgroup:not(.open) .trow .arrow{transform:rotate(-90deg)}
  .trow .arrow:hover{color:var(--fg)}
  ul.tleaves{list-style:none;margin:2px 0 4px;padding:0}
  .tgroup:not(.open) ul.tleaves{display:none}
  ul.tleaves li{padding:0 8px 0 28px;min-height:30px;display:flex;align-items:center;border-radius:6px;cursor:pointer;font-size:13px;color:rgba(0,0,0,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  ul.tleaves li:hover{background:var(--panel2)}
  ul.tleaves li.on{background:#e6f4ff;color:var(--acc)}
  ul.tleaves li.none{color:var(--dim);cursor:default}
  main{flex:1;min-width:0;padding:16px 18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.05em}
  details.reg{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:14px}
  details.reg summary{list-style:none;cursor:pointer;padding:8px 14px;min-height:32px;display:flex;align-items:center;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.05em}
  details.reg summary::-webkit-details-marker{display:none}
  details.reg summary:hover{color:var(--fg)}
  details.reg[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  details.reg .reg-body{padding:0 14px 14px}
  #dag-wrap{overflow:auto;border-radius:8px}
  .zoombar{display:flex;align-items:center;gap:6px;margin:8px 0}
  .zoombar span{color:var(--dim);font-size:12px}
  .zoombar button{min-width:32px;min-height:28px}
  .zoombar button.on{background:#e6f4ff;border-color:var(--acc);color:var(--acc)}
  .dag-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .empty{color:var(--dim);padding:28px 0;text-align:center;font-size:13px}
  .dag-node{cursor:pointer}
  .dag-node:hover rect{filter:brightness(.96)}
  textarea{width:100%;min-height:180px;background:var(--panel);color:var(--fg);border:1px solid #d9d9d9;border-radius:6px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
  input[type=text]{width:100%;background:var(--panel);color:var(--fg);border:1px solid #d9d9d9;border-radius:6px;padding:6px 8px;font-size:13px}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--acc)}
  button.act{background:var(--panel);border:1px solid #d9d9d9;color:var(--fg);padding:0 14px;min-height:32px;border-radius:6px;cursor:pointer;font-size:13px}
  button.act:hover{border-color:var(--acc);color:var(--acc)}
  button.act.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:var(--dim);font-weight:600}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:420px;font-size:12px;line-height:1.5}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px}
  .toast{position:fixed;right:18px;bottom:18px;padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:9;border:1px solid var(--line);background:var(--panel);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv b{color:var(--dim);font-weight:500}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .hidden{display:none}
  h3.sec{font-size:13px;margin:14px 0 8px;color:var(--acc)}
  @media (max-width:760px){
    .layout{flex-direction:column}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    ul.tleaves{display:flex;flex-wrap:wrap;gap:4px}
    .tgroup:not(.open) ul.tleaves{display:none}
  }
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">z-etl 控制台</div>
  <div class="sub" id="envinfo"></div>
  <nav id="menu">
    <div class="tgroup open" data-tab="pipe">
      <div class="trow" onclick="setTab('pipe')"><span class="arrow" onclick="toggleGroup(event,this)">▾</span><span>流水线</span></div>
      <ul class="tleaves" id="plist"></ul>
    </div>
    <div class="tgroup" data-tab="sched">
      <div class="trow" onclick="setTab('sched')"><span class="arrow" style="visibility:hidden">▾</span><span>调度</span></div>
    </div>
    <div class="tgroup open" data-tab="job">
      <div class="trow" onclick="setTab('job')"><span class="arrow" onclick="toggleGroup(event,this)">▾</span><span>作业</span></div>
      <ul class="tleaves" id="jlist"></ul>
    </div>
  </nav>
</aside>
<main>
  <!-- ============ 流水线 ============ -->
  <section id="tab-pipe">
    <details class="reg">
      <summary>登记流水线（yml / JSON 原文）</summary>
      <div class="reg-body">
        <textarea id="spec" spellcheck="false"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="act primary" onclick="registerSpec()">登记</button>
          <button class="act" onclick="loadDemo()">示例</button>
        </div>
      </div>
    </details>
    <div class="panel" id="pdetail">
      <h2>流水线详情 <span class="badge" id="pd-name">未选择</span></h2>
      <div class="row">
        <button class="act primary" onclick="showDag()">拓扑图</button>
        <button class="act" onclick="showSpec()">定义</button>
        <button class="act" onclick="showPlan()">计划解释</button>
        <button class="act" onclick="showRuns()">运行履历</button>
        <button class="act" onclick="showWatermark()">水位</button>
        <button class="act" onclick="exportSavepoint()">导出保存点</button>
        <button class="act" onclick="showSched()">调度登记</button>
      </div>
      <div class="row">
        <button class="act primary" onclick="runPipe(false)">运行</button>
        <button class="act" onclick="runPipe(true)">试跑（不落地）</button>
        <input type="text" id="run-params" placeholder='运行参数 JSON，如 {"bizdate":"2026-11-21"}（可空）' style="flex:1;min-width:220px"/>
      </div>
      <div id="pd-extra" class="hidden"></div>
      <div id="pd-body"><p class="empty">尚未选择流水线——在左侧树点选一条后，这里呈现拓扑 DAG、运行结果与节点指标。</p></div>
    </div>
  </section>

  <!-- ============ 调度 ============ -->
  <section id="tab-sched" class="hidden">
    <div class="panel">
      <h2>全部调度登记</h2>
      <div id="sched-body">加载中…</div>
    </div>
  </section>

  <!-- ============ 作业 ============ -->
  <section id="tab-job" class="hidden">
    <details class="reg">
      <summary>登记作业（yml / JSON 原文）</summary>
      <div class="reg-body">
        <textarea id="jobdesc" spellcheck="false"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="act primary" onclick="registerJob()">登记</button>
        </div>
      </div>
    </details>
    <div class="panel">
      <h2>作业详情 <span class="badge" id="jd-name">未选择</span></h2>
      <div class="row">
        <button class="act" onclick="showJob()">作业描述</button>
        <button class="act primary" onclick="runJob()">运行（首跑全量，之后增量）</button>
        <button class="act" onclick="showJobRuns()">运行履历</button>
        <button class="act" onclick="showJobWatermark()">水位</button>
      </div>
      <div id="jd-body"><p class="empty">尚未选择作业——在左侧树点选一个后，这里呈现运行结果与履历。</p></div>
    </div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
let pipeline = null, job = null;
let lastSpec = null, lastMetrics = null;

function toast(msg, ok) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 4000);
}

async function api(method, path, body, raw) {
  const opt = { method, headers: {} };
  if (body !== undefined && body !== null) {
    if (raw) { opt.headers['Content-Type'] = 'text/plain'; opt.body = body; }
    else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  }
  const res = await fetch(path, opt);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = text; }
  if (!res.ok) {
    const msg = data && data.message ? data.message : (data && data.error ? data.error : String(text).slice(0, 300));
    throw new Error('HTTP ' + res.status + '：' + msg);
  }
  return data;
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function jsonBlock(v) { return '<pre>' + esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2)) + '</pre>'; }
function fmtTime(ts) {
  if (ts == null || ts === '') return '—';
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function kvTable(obj) {
  const rows = Object.keys(obj || {}).map(k => '<tr><th>' + esc(k) + '</th><td>' + esc(
    typeof obj[k] === 'object' && obj[k] !== null ? JSON.stringify(obj[k]) : obj[k]) + '</td></tr>').join('');
  return '<table>' + rows + '</table>';
}

/* ---------- 结果渲染：运行结果 + 节点指标 ---------- */
function renderRunResult(r) {
  if (!r || typeof r !== 'object') return jsonBlock(r);
  const metrics = r.nodeMetrics || {};
  let table = '<table><tr><th>节点</th><th>records-in</th><th>records-out</th><th>其余计数</th></tr>';
  Object.keys(metrics).forEach(n => {
    const m = metrics[n] || {};
    const rest = Object.keys(m).filter(k => k !== 'records-in' && k !== 'records-out' && k !== 'elapsed-nanos')
      .map(k => esc(k) + '=' + m[k]).join('，');
    table += '<tr><td>' + esc(n) + '</td><td>' + (m['records-in'] == null ? '—' : m['records-in'])
      + '</td><td>' + (m['records-out'] == null ? '—' : m['records-out']) + '</td><td>' + (rest || '—') + '</td></tr>';
  });
  table += '</table>';
  const head = '<div class="kv">'
    + '<b>读 / 写</b><span>' + r.recordsRead + ' / ' + r.recordsWritten + '</span>'
    + '<b>模式</b><span>' + esc(r.mode || '—') + (r.restored ? '（恢复自状态快照）' : '') + '</span>'
    + '<b>水位</b><span>' + esc(r.watermarkBefore == null ? '—' : r.watermarkBefore) + ' → ' + esc(r.watermarkAfter == null ? '—' : r.watermarkAfter) + '</span>'
    + '</div>'
    + ((r.notes && r.notes.length) ? '<p style="color:var(--warn);font-size:12px">' + r.notes.map(esc).join('；') + '</p>' : '');
  return head + '<h3 class="sec">节点指标</h3>' + table;
}

/* ---------- 左侧树菜单 ---------- */
function setTab(tab) {
  document.querySelectorAll('.tgroup').forEach(g => g.classList.toggle('on', g.dataset.tab === tab));
  ['pipe', 'sched', 'job'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));
  if (tab === 'sched') loadSchedules();
  if (tab === 'job') refreshJobs().catch(e => toast('作业列表加载失败：' + e.message, false));
}
function toggleGroup(ev, arrow) {
  ev.stopPropagation();
  arrow.closest('.tgroup').classList.toggle('open');
}

/* ---------- 流水线 ---------- */
const DEMO_TEXT = [
  'name: demo-',
  'nodes:',
  '  - id: src',
  '    type: inline.source',
  '    config:',
  '      rows:',
  '        - {id: 1, user: 甲, amount: 100}',
  '        - {id: 2, user: 乙, amount: 200}',
  '        - {id: 3, user: 甲, amount: 300}',
  '  - id: uq',
  '    type: distinct',
  '    config:',
  '      columns: [user]',
  '  - id: agg',
  '    type: aggregate',
  '    config:',
  '      keyBy: [user]',
  '      aggregates:',
  '        - {fn: SUM, column: amount, alias: total}',
  '  - id: out',
  '    type: collect.sink',
  'edges:',
  '  - {from: src, to: uq}',
  '  - {from: uq, to: agg}',
  '  - {from: agg, to: out}',
].join('\n');

function loadDemo() { $('spec').value = DEMO_TEXT; }

async function refreshPipelines() {
  const data = await api('GET', '/api/etl/pipelines');
  const names = data.pipelines || [];
  $('plist').innerHTML = names.length
    ? names.map(n => '<li data-n="' + esc(n) + '" title="' + esc(n) + '" class="' + (n === pipeline ? 'on' : '') + '">' + esc(n) + '</li>').join('')
    : '<li class="none">（空）</li>';
  $('plist').querySelectorAll('li[data-n]').forEach(li => li.onclick = () => { pipeline = li.dataset.n; $('pd-name').textContent = pipeline; lastSpec = null; lastMetrics = null; refreshPipelines(); showDag(); });
}

async function registerSpec() {
  try {
    const data = await api('POST', '/api/etl/pipelines', $('spec').value, true);
    toast('已登记：' + data.name, true);
    pipeline = data.name; $('pd-name').textContent = pipeline;
    lastSpec = null; lastMetrics = null;
    await refreshPipelines(); showDag();
  } catch (e) { toast(e.message, false); }
}

function needPipeline() { if (!pipeline) { toast('先在左侧树选一条流水线', false); return false; } return true; }
function setBody(html) { $('pd-body').innerHTML = html; $('pd-extra').className = 'hidden'; }
function extraPanel(html) { const x = $('pd-extra'); x.innerHTML = html; x.className = ''; }

/* ---------- DAG 拓扑图（纯 SVG，分层布局 + 运行指标叠加） ---------- */
const KIND_STYLE = {
  source:    { stroke: '#389e0d', tag: '源' },
  transform: { stroke: '#8c8c8c', tag: '变换' },
  stateful:  { stroke: '#1677ff', tag: '有状态' },
  sink:      { stroke: '#d46b08', tag: '汇' }
};

function kindOf(type) {
  const t = String(type || '');
  if (/source/.test(t)) return 'source';
  if (/sink/.test(t)) return 'sink';
  if (/^(aggregate|window\.aggregate|dedup|join|interval\.join|dim\.join|cep\.pattern)$/.test(t)) return 'stateful';
  return 'transform';
}

async function fetchSpec() {
  if (!lastSpec || lastSpec.name !== pipeline) {
    lastSpec = await api('GET', '/api/etl/pipelines/' + encodeURIComponent(pipeline));
  }
  return lastSpec;
}

let dagZoom = 'fit';       // 'fit'（适应容器，不小于自然尺寸）或数字倍率
let selectedNode = null;   // 点选查看指标的节点 id

const ZOOMS = [['fit', '适应'], ['1', '1:1'], ['1.5', '150%'], ['2', '200%']];

function renderDag() {
  if (!lastSpec) return;
  const zoomBtns = '<div class="zoombar"><span>缩放</span>'
    + ZOOMS.map(z => '<button class="act' + (String(dagZoom) === z[0] ? ' on' : '') + '" onclick="setDagZoom(\'' + z[0] + '\')">' + z[1] + '</button>').join('')
    + '</div>';
  const nodeKeys = lastSpec.nodes ? lastSpec.nodes.map(n => n.id) : [];
  const sel = selectedNode && nodeKeys.indexOf(selectedNode) >= 0 ? selectedNode : null;
  const detail = sel
    ? '<h3 class="sec">节点指标 · ' + esc(sel) + '</h3>'
      + (lastMetrics && lastMetrics[sel]
        ? kvTable(lastMetrics[sel])
        : '<p class="empty">该节点暂无运行指标——运行 / 试跑后自动叠加。</p>')
    : '';
  $('dag-area').innerHTML = zoomBtns + '<div id="dag-wrap">' + dagSvg(lastSpec, lastMetrics) + '</div>'
    + '<div class="dag-legend">'
    + Object.keys(KIND_STYLE).map(k => '<span class="badge" style="border-color:' + KIND_STYLE[k].stroke + '">' + KIND_STYLE[k].tag + '</span>').join('')
    + '<span class="badge" style="border-color:var(--warn)">行数变化</span></div>'
    + '<p style="font-size:11px;color:var(--dim)">边框色 = 算子类别（绿 源 / 灰 变换 / 蓝 有状态 / 橙 汇）；琥珀色节点 = 进出不等（行数被改写）；点击节点在下方看全量计数，运行 / 试跑后自动叠加最新指标。</p>'
    + detail;
  $('dag-area').querySelector('#dag-wrap').onclick = ev => {
    const g = ev.target.closest ? ev.target.closest('[data-node]') : null;
    if (!g) return;
    selectedNode = g.getAttribute('data-node') === selectedNode ? null : g.getAttribute('data-node');
    renderDag();
  };
}

function setDagZoom(z) { dagZoom = z === 'fit' ? 'fit' : Number(z); renderDag(); }

async function showDag() {
  if (!needPipeline()) return;
  selectedNode = null;
  setBody('<h3 class="sec">拓扑</h3><p class="empty">拓扑加载中…</p>');
  try {
    const spec = await fetchSpec();
    if (!lastMetrics) {
      try {
        const h = await api('GET', '/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/runs?limit=1');
        if (h.runs && h.runs.length) lastMetrics = h.runs[0].nodeMetrics || null;
      } catch (e2) { /* 无履历就空着画 */ }
    }
    setBody('<h3 class="sec">拓扑</h3><div id="dag-area"></div>');
    renderDag();
  } catch (e) {
    setBody('<h3 class="sec">拓扑</h3><p style="color:var(--err)">拓扑加载失败：' + esc(e.message) + '</p>');
    toast(e.message, false);
  }
}

/** 最长路径分层 + 层内居中，返回 SVG 字符串。metrics 可为 null。 */
function dagSvg(spec, metrics) {
  const nodes = spec.nodes || [];
  const edges = (spec.edges || []).filter(e => e && e.from !== e.to);
  const byId = {};
  nodes.forEach(n => byId[n.id] = n);

  const layer = {};
  nodes.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < nodes.length; i++) {
    edges.forEach(e => {
      if (layer[e.from] == null || layer[e.to] == null) return;
      if (layer[e.to] < layer[e.from] + 1) layer[e.to] = layer[e.from] + 1;
    });
  }
  const columns = [];
  nodes.forEach(n => {
    const L = layer[n.id] || 0;
    (columns[L] = columns[L] || []).push(n);
  });
  while (columns.length && !columns[columns.length - 1]) columns.pop();

  const NODE_W = 240, NODE_H = 76, GAP_X = 120, GAP_Y = 44, M = 20;
  const maxRows = Math.max.apply(null, columns.map(c => c.length));
  const W = M * 2 + columns.length * NODE_W + (columns.length - 1) * GAP_X;
  const H = M * 2 + maxRows * NODE_H + (maxRows - 1) * GAP_Y;

  const pos = {};
  columns.forEach((col, L) => {
    const colH = col.length * NODE_H + (col.length - 1) * GAP_Y;
    col.forEach((n, i) => {
      pos[n.id] = { x: M + L * (NODE_W + GAP_X), y: M + (H - M * 2 - colH) / 2 + i * (NODE_H + GAP_Y) };
    });
  });

  const style = dagZoom === 'fit'
    ? 'width:100%;min-width:720px'
    : 'width:' + Math.round(W * dagZoom) + 'px';
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="' + style + ';background:var(--panel);border:1px solid #d9d9d9;border-radius:8px;display:block">'
    + '<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'
    + '<path d="M 0 0 L 10 5 L 0 10 z" fill="#bfbfbf"/></marker></defs>';

  edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
    const dx = Math.max(48, (x2 - x1) / 2);
    svg += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2
      + '" fill="none" stroke="#bfbfbf" stroke-width="2" marker-end="url(#arw)"/>';
  });

  nodes.forEach(n => {
    const p = pos[n.id];
    const kind = kindOf(n.type);
    const st = KIND_STYLE[kind];
    const m = metrics ? metrics[n.id] : null;
    const dropped = m && m['records-in'] != null && m['records-out'] != null && m['records-out'] < m['records-in'];
    const on = n.id === selectedNode;
    const stroke = dropped ? 'var(--warn)' : st.stroke;
    const badge = m
      ? '<text x="' + (p.x + NODE_W - 8) + '" y="' + (p.y + NODE_H - 9) + '" text-anchor="end" font-size="12" fill="#8c8c8c">'
        + esc('in ' + (m['records-in'] == null ? '—' : m['records-in']) + ' · out ' + (m['records-out'] == null ? '—' : m['records-out'])) + '</text>'
      : '';
    const tip = m ? Object.keys(m).map(k => esc(k) + '=' + esc(m[k])).join('\n') : '尚无运行指标';
    svg += '<g class="dag-node" data-node="' + esc(n.id) + '" role="button" aria-label="' + esc(n.id) + ' 节点，查看指标"><title>' + tip + '</title>'
      + '<rect x="' + p.x + '" y="' + p.y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="10" '
      + 'fill="' + (on ? '#e6f4ff' : 'var(--panel)') + '" stroke="' + stroke + '" stroke-width="' + (on ? 3 : 2) + '"/>'
      + '<text x="' + (p.x + 12) + '" y="' + (p.y + 28) + '" font-size="15" font-weight="600" fill="var(--fg)">' + esc(n.id) + '</text>'
      + '<text x="' + (p.x + 12) + '" y="' + (p.y + 49) + '" font-size="12.5" fill="' + st.stroke + '">' + esc(n.type) + '</text>'
      + badge + '</g>';
  });
  return svg + '</svg>';
}

async function showSpec() { if (!needPipeline()) return; lastSpec = await api('GET', '/api/etl/pipelines/' + encodeURIComponent(pipeline)); setBody('<h3 class="sec">定义</h3>' + jsonBlock(lastSpec)); }
async function showPlan() { if (!needPipeline()) return; setBody('<h3 class="sec">计划解释</h3><pre>' + esc(await (await fetch('/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/plan')).text()) + '</pre>'); }
async function showRuns() {
  if (!needPipeline()) return;
  const data = await api('GET', '/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/runs?limit=20');
  const runs = data.runs || [];
  setBody('<h3 class="sec">运行履历（最近 ' + runs.length + ' 次）</h3>' + (runs.length
    ? runs.map((r, i) => '<details' + (i === 0 ? ' open' : '') + '><summary style="cursor:pointer;padding:4px 0">'
      + fmtTime(r.startedAt) + ' · ' + esc(r.mode) + ' · 读 ' + r.recordsRead + ' 写 ' + r.recordsWritten + '</summary>'
      + renderRunResult(r) + '</details>').join('')
    : '<p style="color:var(--dim)">还没有运行记录</p>'));
}
async function showWatermark() {
  if (!needPipeline()) return;
  const res = await fetch('/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/watermark');
  setBody('<h3 class="sec">水位记录</h3>' + (res.status === 404 ? '<p style="color:var(--dim)">还没有水位（没跑过增量）</p>' : kvTable(await res.json())));
}
async function exportSavepoint() {
  if (!needPipeline()) return;
  try {
    const sp = await api('GET', '/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/savepoint');
    extraPanel('<h3 class="sec">保存点报文（复制保存，灌回用）</h3><textarea id="sp-json" style="min-height:220px">' + esc(JSON.stringify(sp, null, 2)) + '</textarea>'
      + '<div class="row" style="margin-top:8px"><button class="act" onclick="copySp()">复制</button></div>');
  } catch (e) { toast(e.message, false); }
}
function copySp() { $('sp-json').select(); document.execCommand('copy'); toast('已复制', true); }
async function showSched() {
  if (!needPipeline()) return;
  const res = await fetch('/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/schedule');
  const cur = res.status === 404 ? null : await res.json();
  extraPanel('<h3 class="sec">调度登记</h3>'
    + '<p style="font-size:12px;color:var(--dim)">' + (cur ? '当前：cron <code>' + esc(cur.cronExpression) + '</code>，' + (cur.enabled ? '已启用' : '已停用') : '未登记') + '</p>'
    + '<div class="row"><input type="text" id="sched-cron" placeholder="cron 表达式（分 时 日 月 周），如 0 0 2 * * ?" style="flex:1;min-width:200px"/>'
    + '<button class="act primary" onclick="saveSched()">保存</button>'
    + (cur ? '<button class="act" onclick="delSched()">取消调度</button>' : '') + '</div>');
}
async function saveSched() {
  try {
    const cron = $('sched-cron').value.trim();
    const r = await api('POST', '/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/schedule?enabled=true', cron, true);
    toast('调度已登记，下次触发：' + (r.nextFireTime || '—'), true); showSched();
  } catch (e) { toast(e.message, false); }
}
async function delSched() {
  try { await api('DELETE', '/api/etl/pipelines/' + encodeURIComponent(pipeline) + '/schedule'); toast('调度已取消', true); showSched(); }
  catch (e) { toast(e.message, false); }
}
async function runPipe(dry) {
  if (!needPipeline()) return;
  const paramsRaw = $('run-params').value.trim();
  let body;
  if (paramsRaw) { try { body = JSON.parse(paramsRaw); } catch (e) { toast('运行参数不是合法 JSON：' + e.message, false); return; } }
  const path = '/api/etl/pipelines/' + encodeURIComponent(pipeline) + (dry ? '/dry-run?rows=100' : '/run');
  try {
    const r = body ? await api('POST', path, body) : await api('POST', path);
    lastMetrics = r.nodeMetrics || null;
    if (lastSpec && lastSpec.name === pipeline) {
      setBody('<h3 class="sec">拓扑（本轮指标已叠加）</h3><div id="dag-area"></div>'
        + '<h3 class="sec">' + (dry ? '试跑结果（不落地）' : '运行结果') + '</h3>' + renderRunResult(r));
      renderDag();
    } else {
      setBody('<h3 class="sec">' + (dry ? '试跑结果（不落地）' : '运行结果') + '</h3>' + renderRunResult(r));
    }
  } catch (e) { toast(e.message, false); }
}

/* ---------- 调度总览 ---------- */
async function loadSchedules() {
  try {
    const data = await api('GET', '/api/etl/pipelines/schedules');
    const list = data.schedules || [];
    $('sched-body').innerHTML = list.length
      ? '<table><tr><th>流水线</th><th>cron</th><th>启用</th><th>上次触发</th><th>下次触发</th></tr>'
        + list.map(s => '<tr><td>' + esc(s.pipelineName) + '</td><td><code>' + esc(s.cronExpression) + '</code></td><td>'
          + (s.enabled ? '是' : '否') + '</td><td>' + fmtTime(s.lastTriggeredAt)
          + '</td><td>' + fmtTime(s.nextFireTime) + '</td></tr>').join('') + '</table>'
      : '<p style="color:var(--dim)">没有调度登记</p>';
  } catch (e) { $('sched-body').innerHTML = '<p style="color:var(--err)">' + esc(e.message) + '</p>'; }
}

/* ---------- 作业 ---------- */
async function refreshJobs() {
  const data = await api('GET', '/api/etl/jobs');
  const names = data.jobs || [];
  $('jlist').innerHTML = names.length
    ? names.map(n => '<li data-n="' + esc(n) + '" title="' + esc(n) + '" class="' + (n === job ? 'on' : '') + '">' + esc(n) + '</li>').join('')
    : '<li class="none">（空）</li>';
  $('jlist').querySelectorAll('li[data-n]').forEach(li => li.onclick = () => { job = li.dataset.n; $('jd-name').textContent = job; refreshJobs(); showJob(); });
}
async function registerJob() {
  try {
    const data = await api('POST', '/api/etl/jobs', $('jobdesc').value, true);
    toast('已登记：' + data.name, true); job = data.name; $('jd-name').textContent = job;
    await refreshJobs(); showJob();
  } catch (e) { toast(e.message, false); }
}
function needJob() { if (!job) { toast('先在左侧树选一个作业', false); return false; } return true; }
async function showJob() { if (!needJob()) return; $('jd-body').innerHTML = '<h3 class="sec">作业描述</h3>' + jsonBlock(await api('GET', '/api/etl/jobs/' + encodeURIComponent(job))); }
async function runJob() {
  if (!needJob()) return;
  try { $('jd-body').innerHTML = '<h3 class="sec">运行中…</h3>'; $('jd-body').innerHTML = '<h3 class="sec">运行结果</h3>' + renderRunResult(await api('POST', '/api/etl/jobs/' + encodeURIComponent(job) + '/run')); }
  catch (e) { toast(e.message, false); $('jd-body').innerHTML = ''; }
}
async function showJobRuns() {
  if (!needJob()) return;
  const data = await api('GET', '/api/etl/jobs/' + encodeURIComponent(job) + '/runs?limit=20');
  const runs = data.runs || [];
  $('jd-body').innerHTML = '<h3 class="sec">运行履历</h3>' + (runs.length
    ? '<table><tr><th>时间</th><th>模式</th><th>读</th><th>写</th><th>对账</th><th>水位</th></tr>'
      + runs.map(r => '<tr><td>' + fmtTime(r.startedAt) + '</td><td>' + esc(r.mode || '')
        + '</td><td>' + r.rowsRead + '</td><td>' + r.rowsWritten + '</td><td>' + (r.reconciled ? '是' : '否')
        + '</td><td>' + esc(r.watermarkAfter || '—') + '</td></tr>').join('') + '</table>'
    : '<p style="color:var(--dim)">还没有运行记录</p>');
}
async function showJobWatermark() {
  if (!needJob()) return;
  const res = await fetch('/api/etl/jobs/' + encodeURIComponent(job) + '/watermark');
  $('jd-body').innerHTML = '<h3 class="sec">水位记录</h3>' + (res.status === 404 ? '<p style="color:var(--dim)">还没有水位</p>' : kvTable(await res.json()));
}

/* ---------- 启动 ---------- */
(async function init() {
  $('envinfo').textContent = '本机 ' + location.host + ' · 同源 API';
  $('spec').value = DEMO_TEXT;
  setTab('pipe');
  try { await refreshPipelines(); } catch (e) { toast('流水线列表加载失败：' + e.message, false); }
})();
</script>
</body>
</html>
