# z-etl 管控面配置
#
# 键名模式：z.base.db.etl.*（ModuleDataSourceTemplate 的权威前缀常量，缺省回落到 z.base.db.default.*）
# 凭据一律走环境变量注入，**不落明文**（组织 008 凭证规范）。

server:
  port: ${ZETL_SERVER_PORT:8092}

z:
  base:
    db:
      etl:
        host: ${ZETL_DB_HOST:127.0.0.1}
        port: ${ZETL_DB_PORT:3306}
        database: ${ZETL_DB_NAME:etl}
        username: ${ZETL_DB_USERNAME:etl}
        password: ${ZETL_DB_PASSWORD:}
        initial-size: 2
        min-idle: 2
        max-active: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zifang.z.etl: INFO
